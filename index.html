<style>
:root{
  color-scheme: light;
  --paper:#f4f6f2; --surface:#ffffff; --ink:#1f2b26; --muted:#5d6a63; --line:#d3dad0;

}
@media (prefers-color-scheme: dark){

    color-scheme: dark;
    --paper:#111916; --surface:#18221e; --ink:#e4ebe6; --muted:#9aa8a0; --line:#2c3a34;

    --shadow:0 -6px 24px rgba(0,0,0,.4);
  }
}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0}
body{
  font-family:"Zen Kaku Gothic New","Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP",system-ui,sans-serif;
  background:var(--paper); color:var(--ink); line-height:1.7; -webkit-font-smoothing:antialiased;
}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--river);outline-offset:2px}

#map{position:fixed;inset:0;background:var(--paper)}
#nokey{

  color:var(--muted);font-size:.9rem;text-align:center;
}
#nokey code{background:var(--surface);padding:.1em .4em;border-radius:4px;border:1px solid var(--line)}

#panel{
  position:fixed;left:0;right:0;bottom:0;z-index:2;

  transition:max-height .28s ease;
}
#panel.open{max-height:72vh}
@media (min-width:900px){
  #panel,#panel.open{
    top:0;right:auto;width:420px;max-height:none;border-radius:0;
    border-top:0;border-right:1px solid var(--line);box-shadow:none;

.chip[aria-current="true"]{background:var(--river);border-color:var(--river);color:var(--river-ink)}

.scroll{overflow-y:auto;padding:0 1.25rem 1.25rem;flex:1;min-height:0}
.intro p{margin:.2rem 0 .9rem;font-size:.9rem;color:var(--muted)}
.btn{

.btn.primary{background:var(--river);border-color:var(--river);color:var(--river-ink)}

/* ================= データ ================= */
function parseCSV(text){
  const rows=[]; let row=[], f="", q=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(q){ if(c==='"'){ if(text[i+1]==='"'){f+='"';i++;} else q=false; } else f+=c; }
    else if(c==='"') q=true;
    else if(c===','){ row.push(f); f=""; }
    else if(c==='\n'||c==='\r'){ if(c==='\r'&&text[i+1]==='\n') i++; row.push(f); rows.push(row); row=[]; f=""; }
    else f+=c;
  }
  if(f!==""||row.length){ row.push(f); rows.push(row); }
  return rows;
}
async function loadWorks(){
  let list = EMBEDDED_WORKS;
  if(CONFIG.SHEET_CSV_URL){
    try{
      const res = await fetch(CONFIG.SHEET_CSV_URL, {cache:"no-store"});
      if(!res.ok) throw new Error(res.status);
      const rows = parseCSV(await res.text());
      const hi = rows.findIndex(r => r[0] === "id");
      if(hi < 0) throw new Error("header row not found");
      const h = rows[hi];
      const parsed = rows.slice(hi+1).filter(r => r[0]).map(r => Object.fromEntries(h.map((k,i)=>[k, r[i] ?? ""])));
      if(parsed.length) list = parsed;
    }catch(e){ console.warn("Sheet load failed, using embedded data:", e); }
  }
  return list
    .map(w => ({...w, lat:parseFloat(w.lat), lng:parseFloat(w.lng), order:parseInt(w.order,10)}))
    .filter(w => Number.isFinite(w.lat) && Number.isFinite(w.lng))
    .filter(w => CONFIG.SHOW_UNPUBLISHED || String(w.published).toUpperCase() === "TRUE")
    .sort((a,b) => a.order - b.order);
}

function meters(a,b){
  const R=6371000, toR=Math.PI/180, la=(a.lat+b.lat)/2*toR;
  const dx=(b.lng-a.lng)*toR*R*Math.cos(la), dy=(b.lat-a.lat)*toR*R;
  return Math.max(5, Math.round(Math.hypot(dx,dy)/5)*5);
}
const pick = (w,k) => (lang==="en" && w[k+"_en"]) ? w[k+"_en"] : (w[k+"_ja"] || w[k+"_en"] || "");
const navURL = (w) => `https://www.google.com/maps/dir/?api=1&destination=${w.lat},${w.lng}&travelmode=walking`;
const esc = (s) => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

/* ================= 描画 ================= */
function renderChrome(){
  document.documentElement.lang = lang;
  $("#title").textContent = CONFIG.TITLE[lang];
  $("#subtitle").textContent = CONFIG.SUBTITLE[lang];
  $("#lang").textContent = T[lang].toggle;
  $("#locate").textContent = T[lang].locate;
  $("#rail").innerHTML = works.map((w,i)=>
    `<button class="chip" type="button" data-i="${i}" aria-label="${w.order}. ${esc(pick(w,"title"))}" ${i===current?'aria-current="true"':""}>${w.order}</button>`
  ).join("");
}
function renderIntro(){
  const t=T[lang], first=works[0];
  $("#body").innerHTML = `<div class="intro">
    <p>${t.intro}</p>
    <div class="actions">
      <button class="btn primary" type="button" data-go="0">${t.start}</button>
      ${first?`<a class="btn" href="${navURL(first)}" target="_blank" rel="noopener">${t.access}</a>`:""}
    </div></div>`;
}
function renderCard(i){
  const t=T[lang], w=works[i], nx=works[i+1], pv=works[i-1];
  const titleMain = pick(w,"title"), titleOther = lang==="ja" ? w.title_en : w.title_ja;
  const meta = [w.year, pick(w,"material"), w.size].filter(Boolean).join("、");
  const touch = w.touch ? (w.touch.includes("OK") ? `<span class="touch ok">${t.ok}</span>` : `<span class="touch no">${t.no}</span>`) : "";
  const cap = pick(w,"caption");
  $("#body").innerHTML = `<article class="card">
      <div class="num" aria-hidden="true">${w.order}</div>
      <h2>${esc(titleMain)}</h2>
      ${titleOther && titleOther!==titleMain ? `<p class="sub">${esc(titleOther)}</p>`:""}
      <p class="artist">${esc(pick(w,"artist"))}</p>
      ${meta?`<p class="meta">${esc(meta)}</p>`:""}
      ${touch}
      <p class="caption" lang="${lang==="en"&&w.caption_en?"en":"ja"}">${esc(cap)}</p>
      <div class="actions"><a class="btn" href="${navURL(w)}" target="_blank" rel="noopener">${t.nav}</a></div>
      ${nx ? `<button class="next" type="button" data-go="${i+1}">
                <span class="n">${nx.order}</span>
                <span><small>${t.next}　${t.walk(meters(w,nx))}</small><strong>${esc(pick(nx,"title"))}</strong></span>
              </button>`
           : `<p class="meta" style="margin-top:1.4rem">${t.last}</p>
              <button class="next" type="button" data-go="0"><span class="n">${works[0].order}</span><span><strong>${t.toFirst}</strong></span></button>`}
      ${pv ? `<button class="prevlink" type="button" data-go="${i-1}">${t.prev}</button>`:""}
    </article>`;
  $("#body").scrollTop = 0;
}
function select(i, {pan=true, push=true}={}){
  current = i;
  panel.classList.toggle("open", i>=0);
  renderChrome();
  if(i<0){ renderIntro(); }
  else{
    renderCard(i);
    const chip = $(`.chip[data-i="${i}"]`); chip && chip.scrollIntoView({block:"nearest",inline:"center",behavior:"smooth"});
    if(push) history.replaceState(null,"",`#${works[i].id}`);
  }
  markers.forEach((m,k)=>{ m.content.classList.toggle("active", k===i); m.zIndex = k===i ? 10 : 1; });
  if(map && pan && i>=0) panTo(works[i]);
}
function panTo(w){
  map.panTo({lat:w.lat,lng:w.lng});
  if(map.getZoom() < 19) map.setZoom(19);
  if(window.innerWidth < 900) map.panBy(0, Math.round(window.innerHeight*0.25));
}

/* ================= 地図 ================= */
function loadMapsAPI(key){
  // Google 公式の動的ローダー
  (g=>{var h,a,k,p="The Google Maps JavaScript API",c="google",l="importLibrary",q="__ib__",m=document,b=window;b=b[c]||(b[c]={});var d=b.maps||(b.maps={}),r=new Set,e=new URLSearchParams,u=()=>h||(h=new Promise(async(f,n)=>{await (a=m.createElement("script"));e.set("libraries",[...r]+"");for(k in g)e.set(k.replace(/[A-Z]/g,t=>"_"+t[0].toLowerCase()),g[k]);e.set("callback",c+".maps."+q);a.src=`https://maps.${c}apis.com/maps/api/js?`+e;d[q]=f;a.onerror=()=>h=n(Error(p+" could not load."));a.nonce=m.querySelector("script[nonce]")?.nonce||"";m.head.append(a)}));d[l]?console.warn(p+" only loads once. Ignoring:",g):d[l]=(f,...n)=>r.add(f)&&u().then(()=>d[l](f,...n))})({key, v:"weekly", language:lang, region:"JP"});
}
async function initMap(){
  const key = CONFIG.GOOGLE_MAPS_API_KEY;
  if(!key || key==="YOUR_API_KEY"){ const n=$("#nokey"); n.innerHTML=`<p style="max-width:28em;margin:0">${T[lang].nokey}</p>`; n.hidden=false; return; }
  loadMapsAPI(key);
  const { Map, Polyline } = await google.maps.importLibrary("maps");
  ({ AdvancedMarkerElement: AdvancedMarker } = await google.maps.importLibrary("marker"));
  const core = await google.maps.importLibrary("core");
  const opts = { mapId:CONFIG.MAP_ID, center:{lat:works[0].lat,lng:works[0].lng}, zoom:18,
                 disableDefaultUI:true, zoomControl:true, clickableIcons:false, gestureHandling:"greedy" };
  if(core.ColorScheme) opts.colorScheme = core.ColorScheme.FOLLOW_SYSTEM;
  map = new Map($("#map"), opts);

  // 順路（作品同士を直線でつないだ目安。実際の歩行ルートではありません）
  new Polyline({ map, path: works.map(w=>({lat:w.lat,lng:w.lng})), strokeOpacity:0,
    icons:[{ icon:{ path:"M 0,-1 0,1", strokeOpacity:.9, strokeColor:"#2c6e8f", scale:3 }, offset:"0", repeat:"12px" }] });

  markers = works.map((w,i)=>{
    const el = document.createElement("div"); el.className="pin"; el.textContent=w.order;
    const m = new AdvancedMarker({ map, position:{lat:w.lat,lng:w.lng}, content:el, title:`${w.order}. ${w.title_ja}`, gmpClickable:true });
    m.addListener("gmp-click", ()=>select(i));
    return m;
  });

  const b = new google.maps.LatLngBounds(); works.forEach(w=>b.extend({lat:w.lat,lng:w.lng}));
  const wide = window.innerWidth >= 900;
  map.fitBounds(b, wide ? 60 : {top:60,left:30,right:30,bottom:Math.round(window.innerHeight*0.48)});
  if(current>=0) select(current,{push:false});
  $("#locate").hidden = false;
  let loaded=false;
  google.maps.event.addListenerOnce(map,"tilesloaded",()=>{ loaded=true; });
  setTimeout(()=>{ if(!loaded && $("#nokey").hidden){
    const n=$("#nokey");
    n.innerHTML=`<p style="max-width:30em;margin:0">地図の読み込みが完了していません。通信状況を確認するか、ブラウザのコンソールに出ているエラーを確認してください。</p>`;
    n.hidden=false; n.style.zIndex=1; n.style.pointerEvents="none";
  }},10000);
}
function locate(){
  const btn=$("#locate"); if(!navigator.geolocation||!map) return;
  btn.textContent=T[lang].locating;
  navigator.geolocation.getCurrentPosition(p=>{
    const pos={lat:p.coords.latitude,lng:p.coords.longitude};
    if(!meMarker){ const el=document.createElement("div"); el.className="me"; meMarker=new AdvancedMarker({map,position:pos,content:el,zIndex:5}); }
    else meMarker.position=pos;
    map.panTo(pos); btn.textContent=T[lang].locate;
  },()=>{ btn.textContent=T[lang].locFail; setTimeout(()=>btn.textContent=T[lang].locate,2500); },{enableHighAccuracy:true,timeout:10000});
}

// APIキーの認証に失敗したとき Google から呼ばれる
window.gm_authFailure = () => {
  const n=$("#nokey");
  n.innerHTML = `<p style="max-width:30em;margin:0">地図を読み込めませんでした（APIキーの認証エラー）。<br>
    ブラウザのコンソールに表示されるエラー名を確認してください。<br>
    RefererNotAllowedMapError：キーのウェブサイト制限にこのページのURLが含まれていません。<br>
    ApiNotActivatedMapError：Maps JavaScript API が有効になっていません。<br>
    BillingNotEnabledMapError：請求先アカウントが紐づいていません。<br>
    InvalidKeyMapError：キーの文字列が正しくありません。</p>`;
  n.hidden=false; n.style.zIndex=1; n.style.background="var(--paper)";
  $("#locate").hidden=true;
};

/* ================= イベント ================= */
document.addEventListener("click",(e)=>{
  const chip=e.target.closest(".chip"); if(chip){ select(+chip.dataset.i); return; }
  const go=e.target.closest("[data-go]"); if(go){ select(+go.dataset.go); return; }
});
$("#lang").addEventListener("click",()=>{
  lang = lang==="ja" ? "en" : "ja";
  try{ localStorage.setItem("nora-lang",lang); }catch{}
  select(current,{pan:false,push:false});
});
$("#locate").addEventListener("click",locate);
document.addEventListener("keydown",(e)=>{
  if(e.key==="Escape" && current>=0){ history.replaceState(null,"",location.pathname); select(-1); }
  if(current>=0 && e.key==="ArrowRight" && current<works.length-1) select(current+1);
  if(current>=0 && e.key==="ArrowLeft" && current>0) select(current-1);
});
window.addEventListener("hashchange",()=>{
  const i=works.findIndex(w=>`#${w.id}`===location.hash); if(i>=0 && i!==current) select(i,{push:false});
});

/* ================= 起動 ================= */
(async()=>{
  works = await loadWorks();
  const i = works.findIndex(w=>`#${w.id}`===location.hash);
  select(i, {pan:false, push:false});
  try{ await initMap(); }catch(e){ console.error(e); const n=$("#nokey"); n.textContent="地図を読み込めませんでした。APIキーと参照元の制限を確認してください。"; n.hidden=false; }
})();
</script>
</body>
